<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-Time Group Chat</title>
  <link rel="stylesheet" href="style.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <div class="chat-app">
    <div class="sidebar">
      <h3>Group Chat</h3>
      <p class="student-info">Samarth Navale (150096725148)</p>
      
      <div class="login-box">
        <label>Username: <input type="text" id="usernameInput" value="User1"></label>
        <button id="loginBtn">Set Name</button>
      </div>

      <h4>Rooms</h4>
      <ul class="room-list">
        <li class="room-item active" data-room="general"># general</li>
        <li class="room-item" data-room="developers"># developers</li>
        <li class="room-item" data-room="random"># random</li>
      </ul>

      <h4>Online in Room (<span id="userCount">0</span>)</h4>
      <ul class="user-list" id="userList"></ul>
    </div>

    <div class="chat-main">
      <div class="chat-header">
        <h3 id="currentRoomTitle"># general</h3>
      </div>

      <div class="messages-container" id="messagesContainer"></div>

      <div class="typing-indicator" id="typingIndicator"></div>

      <form class="message-form" id="messageForm">
        <input type="text" id="messageInput" placeholder="Type a message..." autocomplete="off">
        <button type="submit">Send</button>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
